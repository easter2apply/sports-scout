name: Sports Scout
on:
  schedule:
    - cron: "11 * * * *"          # hourly backup; cron-job.org runs it every 15 minutes
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sports-scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Sports Scout
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python sports_scout.py --out site/index.html
      - name: Save bot memory
        run: |
          git config user.name "sports-scout"
          git config user.email "sports-scout@users.noreply.github.com"
          git add sports_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update state" && git pull --rebase && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sports-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
